<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArbeitsTime - Control Horario</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Tesseract.js para leer texto de fotos -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between pb-20">

    <!-- Header superior -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 flex justify-between items-center shadow">
        <h1 class="text-base font-bold tracking-wider text-emerald-400">ArbeitsTime</h1>
        <div id="active-user-display" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full truncate max-w-[150px]">
            Sin empleado
        </div>
    </header>

    <!-- Contenedor Principal de Vistas -->
    <main id="app-container" class="p-4 flex-1 max-w-md w-full mx-auto">
        
        <!-- VISTA 1: CRONÓMETRO Y REGISTRO -->
        <section id="view-timer" class="space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg text-center">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Cronómetro Activo</h2>
                <div id="timer-display" class="text-5xl font-mono font-bold tracking-tight text-white my-3">00:00:00</div>
                <div id="timer-status-label" class="text-xs text-emerald-400 mb-4 font-medium">Selecciona un empleado para comenzar</div>
                
                <!-- Selector de Empleado Activo (Auth) -->
                <div class="space-y-3 text-left mb-5">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1 font-medium">Empleado Activo:</label>
                        <select id="select-active-employee" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="">Selecciona quién eres...</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1 font-medium">Cliente / Proyecto (Opcional):</label>
                        <select id="select-client" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="">Sin cliente (Solo jornada general)</option>
                        </select>
                    </div>
                </div>

                <!-- Botones de Control Táctil -->
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button id="btn-start" class="bg-emerald-600 active:bg-emerald-700 text-white font-semibold py-3 px-3 rounded-xl shadow transition text-sm flex items-center justify-center gap-1">
                        ▶ Iniciar
                    </button>
                    <button id="btn-break" class="bg-amber-600 active:bg-amber-700 text-white font-semibold py-3 px-3 rounded-xl shadow transition text-sm flex items-center justify-center gap-1">
                        ⏸ Pausa
                    </button>
                </div>
                <button id="btn-stop" class="w-full bg-rose-600 active:bg-rose-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                    ⏹ Finalizar y Guardar Turno
                </button>
            </div>
        </section>

        <!-- VISTA 2: ACTIVIDADES POR CLIENTE -->
        <section id="view-activities" class="hidden space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h2 class="text-lg font-bold mb-3 text-emerald-400">Registrar Actividad</h2>
                <form id="form-activity" class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">Cliente:</label>
                        <select id="activity-client-select" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                            <option value="">Cargando clientes...</option>
                        </select>
                    </div>
                    <div>
                        <input type="text" id="activity-name" placeholder="Nombre de la actividad (ej. Poda, Instalación)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    </div>
                    <div>
                        <textarea id="activity-desc" placeholder="Descripción detallada (opcional)" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 py-2.5 rounded-xl font-semibold text-sm text-white">Guardar Actividad</button>
                </form>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h3 class="text-sm font-bold mb-2 text-slate-300">Historial de Actividades</h3>
                <div id="activities-list" class="space-y-2 text-sm text-slate-400">Cargando...</div>
            </div>
        </section>

        <!-- VISTA 3: EMPLEADOS -->
        <section id="view-employees" class="hidden space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h2 class="text-lg font-bold mb-3 text-emerald-400">Nuevo Empleado</h2>
                <form id="form-employee" class="space-y-3">
                    <input type="text" id="emp-name" placeholder="Nombre completo" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <input type="text" id="emp-role" placeholder="Cargo o especialidad (ej. Jardinería)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 py-2.5 rounded-xl font-semibold text-sm">Guardar Empleado</button>
                </form>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h3 class="text-sm font-bold mb-2 text-slate-300">Personal Registrado</h3>
                <div id="employees-list" class="space-y-2 text-sm text-slate-400">Cargando...</div>
            </div>
        </section>

        <!-- VISTA 4: CLIENTES -->
        <section id="view-clients" class="hidden space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h2 class="text-lg font-bold mb-3 text-emerald-400">Nuevo Cliente</h2>
                
                <!-- Botón rápido para tomar foto al aviso de la casa -->
                <div class="mb-3 bg-slate-900 border border-dashed border-slate-600 rounded-xl p-3 text-center">
                    <label class="cursor-pointer flex flex-col items-center space-y-1">
                        <span class="text-2xl">📸</span>
                        <span class="text-xs text-emerald-400 font-semibold">Tomar foto al aviso de la casa</span>
                        <span class="text-[10px] text-slate-400">Rellena la dirección automáticamente</span>
                        <input type="file" id="client-photo-input" accept="image/*" capture="environment" class="hidden">
                    </label>
                    <div id="scan-status" class="text-xs mt-1 text-slate-400"></div>
                </div>

                <form id="form-client" class="space-y-3">
                    <input type="text" id="client-company" placeholder="Nombre de la empresa / Cliente" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <input type="text" id="client-address" placeholder="Dirección (o usa la cámara arriba)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <input type="text" id="client-contact" placeholder="Nombre de contacto" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <input type="tel" id="client-phone" placeholder="Teléfono" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <input type="text" id="client-project" placeholder="Nombre del proyecto (opcional)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                    <button type="submit" class="w-full bg-emerald-600 active:bg-emerald-700 py-2.5 rounded-xl font-semibold text-sm text-white">Guardar Cliente</button>
                </form>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
                <h3 class="text-sm font-bold mb-2 text-slate-300">Clientes Registrados</h3>
                <div id="clients-list" class="space-y-2 text-sm text-slate-400">Cargando...</div>
            </div>
        </section>
    </main>

    <!-- Barra de Navegación Inferior (Móvil) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 py-2 px-4 flex justify-around items-center z-50 shadow-lg">
        <button onclick="switchView('timer')" class="nav-btn flex flex-col items-center text-emerald-400 text-xs font-medium">
            <span class="text-xl mb-0.5">⏱</span>
            <span>Reloj</span>
        </button>
        <button onclick="switchView('activities')" class="nav-btn flex flex-col items-center text-slate-400 text-xs font-medium">
            <span class="text-xl mb-0.5">📋</span>
            <span>Actividades</span>
        </button>
        <button onclick="switchView('employees')" class="nav-btn flex flex-col items-center text-slate-400 text-xs font-medium">
            <span class="text-xl mb-0.5">👷‍♂️</span>
            <span>Personal</span>
        </button>
        <button onclick="switchView('clients')" class="nav-btn flex flex-col items-center text-slate-400 text-xs font-medium">
            <span class="text-xl mb-0.5">🏢</span>
            <span>Clientes</span>
        </button>
    </nav>

    <!-- Orquestador principal como Módulo ES -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
